
<!DOCTYPE html>

</head>
<body>

<header>
    <h1>
        <i class="fa-solid fa-chalkboard"></i>
        Gestión de Materias
    </h1>

   <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html">Usuario</a>

<main>
    <section>
        <h2>Registrar Materia</h2>

        <form id="formMateria">
            <label for="nombreMateria">Nombre de la materia:</label>
            <input type="text" id="nombreMateria" required>

            <label for="cursoMateria">Curso:</label>
            <input type="text" id="cursoMateria" required>

            <label for="profesorMateria">Profesor:</label>
            <input type="text" id="profesorMateria" required>

            <button type="submit">Guardar</button>
            <button type="button" id="btnModificar">Modificar</button>
            <button type="button" id="btnEliminar">Eliminar</button>
            <button type="button" id="btnLimpiar">Limpiar</button>
        </form>
    </section>

    <section>
        <h2>Listado de Materias</h2>
        <ul id="listaMaterias"></ul>
    </section>
</main>

<script src="js/app.js"></script>
<script src="js/bot.js"></script>

</body>
</html>
