</head>
<body>

<header>
    <h1>
        <i class="fa-solid fa-users-between-lines"></i>
        Gestión de Cursos

    <nav>
    <a href="index.html">Inicio</a>

<main>

    <section>
        <h2>Registrar Curso</h2>

        <form id="formCurso">

            <label for="nombreCurso">Curso:</label>
            <input type="text" id="nombreCurso" placeholder="Ej: 1° Año" required>

            <label for="divisionCurso">División:</label>
            <input type="text" id="divisionCurso" placeholder="Ej: A" required>

            <button type="submit">Guardar</button>
            <button type="button" id="btnModificarCurso">Modificar</button>
            <button type="button" id="btnEliminarCurso">Eliminar</button>
            <button type="button" id="btnLimpiarCurso">Limpiar</button>

        </form>
    </section>

    <section>
        <h2>Listado de Cursos</h2>
        <ul id="listaCursos"></ul>
    </section>

</main>

<script src="js/app.js"></script>
<script src="js/bot.js"></script>

</body>
</html>
