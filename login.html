<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuario - SIGEA</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    .demo-login { max-width: 430px; margin: 30px auto; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 3px 16px #0001; }
    .demo-login label { display:block; margin: 12px 0 5px; }
    .demo-login input, .demo-login select { box-sizing:border-box; width:100%; padding:11px; border:1px solid #bbb; border-radius:7px; }
    .demo-login button { margin-top:18px; padding:11px 18px; border:0; border-radius:7px; background:#7d194f; color:#fff; cursor:pointer; }
    .demo-note { max-width:430px; margin:12px auto; padding:14px; background:#fff5e8; border-radius:8px; font-size:14px; }
    #loginMensaje { margin-top:12px; font-weight:bold; }
  </style>
</head>
<body>
<header>
  <h1><i class="fa-solid fa-people-line"></i> Inicio de Sesión</h1>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html">Usuario</a>
    <a href="alumnos.html">Alumnos</a>
    <a href="docentes.html">Docentes</a>
    <a href="materias.html">Materias</a>
    <a href="curso.html">Curso</a>
    <a href="calificaciones.html">Calificaciones</a>
  </nav>
</header>

<section class="demo-login">
  <h2>Ingresar a SIGEA</h2>
  <form id="formLogin">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit">Ingresar</button>
    <button type="button" id="cerrarSesion" style="background:#666; margin-left:6px;">Cerrar sesión</button>
    <p id="loginMensaje" role="status" aria-live="polite"></p>
  </form>
</section>

<div class="demo-note">
  <strong>Accesos de demostración (no son cuentas reales):</strong><br>
  admin / sigea123 — Administrador<br>
  docente / sigea123 — Docente<br>
  alumno / sigea123 — Alumno<br>
  tutor / sigea123 — Padre o tutor
</div>

<script src="js/login-demo.js" defer></script>
</body>
</html>
