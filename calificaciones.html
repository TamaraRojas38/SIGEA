
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Calificaciones - SIGEA</title>

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/bot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

<header>
    <h1>
        <i class="fa-solid fa-pen-to-square"></i>
        Gestión de Calificaciones
    </h1>

    <nav>
    <a href="index.html">Inicio</a>
    <a href="login.html">Usuario</a>
    <a href="alumnos.html">Alumnos</a>
    <a href="docentes.html">Docentes</a>
    <a href="materias.html">Materias</a>
    <a href="curso.html">Curso</a>
    <a href="calificaciones.html">Calificaciones</a>
    <a href="asistencias.html">Asistencias</a>
    <a href="reportes.html">Reportes</a>
</nav>
</header>

<main>

    <section>
        <h2>Registrar Calificación</h2>

        <form id="formCalificacion">

            <label for="alumnoCalificacion">Alumno:</label>
            <select id="alumnoCalificacion" required>
                <option value="">Seleccionar alumno</option>
            </select>

            <label for="materiaCalificacion">Materia:</label>
            <select id="materiaCalificacion" required>
                <option value="">Seleccionar materia</option>
            </select>

            <label for="notaCalificacion">Calificación:</label>
            <input
                type="number"
                id="notaCalificacion"
                min="1"
                max="10"
                step="0.1"
                required
            >

            <label for="observacionesCalificacion">Observaciones:</label>
            <textarea
                id="observacionesCalificacion"
                placeholder="Ingrese observaciones..."
            ></textarea>

            <button type="submit">Guardar</button>
            <button type="button" id="btnModificarCalificacion">Modificar</button>
            <button type="button" id="btnEliminarCalificacion">Eliminar</button>
            <button type="button" id="btnLimpiarCalificacion">Limpiar</button>

        </form>
    </section>

    <section>
        <h2>Listado de Calificaciones</h2>
        <ul id="listaCalificaciones"></ul>
    </section>

</main>

<script src="js/app.js"></script>
<script src="js/bot.js"></script>

</body>
</html>
